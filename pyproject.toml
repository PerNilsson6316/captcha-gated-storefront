[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-gated-storefront"
version = "0.1.0"
description = "A typed storefront service that verifies signup captcha tokens before accepting customers."
requires-python = ">=3.11"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/storefront_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
